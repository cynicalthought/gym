<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>4-Day Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#060608; --surface:#0e0e12; --card:#141418;
  --line:rgba(255,255,255,.08); --text:#f5f5f7; --mute:#9a9aa8; --faint:#6a6a78;
  --accent:#ff3b3b; --accent2:#ff6b4a; --glow:rgba(255,59,59,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Instrument Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;
  background-image:
    radial-gradient(ellipse 100% 60% at 80% -10%, rgba(255,59,59,.18), transparent 50%),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(255,80,40,.06), transparent 45%);
}

/* Top bar */
.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:.9rem 1.4rem;max-width:1100px;margin:0 auto;
  background:linear-gradient(to bottom, rgba(6,6,8,.95) 60%, transparent);
}
.brand{font-family:Syne,sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.brand em{color:var(--accent);font-style:normal}
.top-actions{display:flex;align-items:center;gap:.5rem}
.flag-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);cursor:pointer;font-size:1.25rem;
  display:grid;place-items:center;transition:.15s;line-height:1;
}
.flag-btn:hover,.flag-btn.on{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.timer-btn{
  padding:.55rem 1.1rem;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#ff5533);color:#fff;
  font-weight:600;font-size:.82rem;box-shadow:0 4px 18px var(--glow);
}

/* Main */
.main{max-width:1100px;margin:0 auto;padding:0 1.4rem 4rem}

/* Day chooser — large cards, not pills/dropdowns */
.days{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;
  margin:1.2rem 0 2rem;
}
@media(max-width:720px){.days{grid-template-columns:1fr 1fr}}
.day-card{
  position:relative;padding:1.35rem 1.1rem;border-radius:20px;
  background:var(--card);border:1px solid var(--line);
  cursor:pointer;transition:.22s;overflow:hidden;text-align:left;
}
.day-card:hover{border-color:rgba(255,255,255,.14);transform:translateY(-2px)}
.day-card.on{
  border-color:rgba(255,59,59,.45);
  background:linear-gradient(160deg,rgba(255,59,59,.14),var(--card));
  box-shadow:0 0 0 1px rgba(255,59,59,.15), 0 12px 40px rgba(255,59,59,.08);
}
.day-card .n{
  font-family:Syne,sans-serif;font-weight:800;font-size:2rem;
  color:rgba(255,255,255,.08);line-height:1;margin-bottom:.35rem;
}
.day-card.on .n{color:rgba(255,59,59,.25)}
.day-card .label{font-weight:700;font-size:.95rem;letter-spacing:-.01em}
.day-card .count{font-size:.75rem;color:var(--faint);margin-top:.25rem}
.day-card.on .label{color:#fff}

/* Exercise grid */
.ex-grid{display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:900px){.ex-grid{grid-template-columns:1fr 1fr}}

.ex{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .2s;
}
.ex:hover{border-color:rgba(255,255,255,.12)}
.ex-head{padding:1.2rem 1.25rem 1rem}
.ex-head .row{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.ex-name{font-family:Syne,sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.ex-sets{
  flex-shrink:0;font-size:.7rem;font-weight:700;color:var(--accent);
  background:rgba(255,59,59,.12);padding:.25rem .55rem;border-radius:8px;
}
.ex-muscles{font-size:.8rem;color:var(--faint);margin-top:.3rem}

/* Large muscle target cards */
.targets{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:.7rem;padding:0 1.25rem 1.1rem;
}
.t-card{
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:18px;padding:1rem .75rem .85rem;text-align:center;
  transition:border-color .2s, transform .2s;
}
.t-card:hover{border-color:rgba(255,59,59,.35);transform:translateY(-2px)}
.t-art{
  width:72px;height:72px;margin:0 auto .65rem;border-radius:18px;
  background:linear-gradient(145deg,rgba(255,59,59,.18),rgba(255,59,59,.04));
  border:1px solid rgba(255,59,59,.12);
  display:grid;place-items:center;
}
.t-art svg{width:40px;height:40px}
.t-pct{
  font-family:Syne,sans-serif;font-weight:800;font-size:1.35rem;
  color:var(--accent);letter-spacing:-.03em;line-height:1;margin-bottom:.2rem;
}
.t-name{font-size:.72rem;font-weight:600;color:var(--mute);line-height:1.3}

/* Tips */
.tips{padding:0 1.25rem 1rem}
.tips h4{
  font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);margin-bottom:.45rem;
}
.tips ul{list-style:none;display:flex;flex-direction:column;gap:.3rem}
.tips li{font-size:.84rem;color:var(--mute);padding-left:.9rem;position:relative}
.tips li::before{
  content:"";position:absolute;left:0;top:.55rem;
  width:5px;height:5px;border-radius:50%;background:var(--accent);
}

/* Media */
.media-area{padding:0 1.25rem 1.25rem;margin-top:auto}
.g-row{display:flex;gap:.4rem;margin-bottom:.65rem}
.g-btn{
  flex:1;padding:.5rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--mute);
  font-size:.8rem;font-weight:600;cursor:pointer;transition:.15s;
}
.g-btn:hover{color:var(--text)}
.g-btn.on{
  background:linear-gradient(135deg,var(--accent),#ff5533);
  border-color:transparent;color:#fff;box-shadow:0 2px 12px var(--glow);
}
.stage{
  width:100%;aspect-ratio:9/16;max-height:380px;
  background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line);
}
.stage video,.stage img{width:100%;height:100%;object-fit:contain;display:block}

.panel{display:none}
.panel.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

footer{
  max-width:1100px;margin:0 auto;padding:1.5rem 1.4rem 2.5rem;
  text-align:center;color:var(--faint);font-size:.78rem;border-top:1px solid var(--line);
}

/* Timer modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);
  z-index:60;display:none;align-items:center;justify-content:center;padding:1rem;
}
.overlay.show{display:flex}
.modal{
  background:#111114;border:1px solid var(--line);border-radius:24px;
  padding:1.8rem 1.5rem;width:100%;max-width:320px;text-align:center;
}
.modal h3{font-family:Syne,sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:.2rem}
.modal p{color:var(--faint);font-size:.8rem;margin-bottom:1rem}
.presets{display:flex;gap:.35rem;justify-content:center;margin-bottom:.7rem}
.pre{
  padding:.35rem .7rem;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--mute);font-size:.78rem;font-weight:600;cursor:pointer;
}
.pre.on{border-color:var(--accent);color:var(--accent)}
.clock{
  font-family:Syne,sans-serif;font-weight:800;font-size:3.5rem;
  background:linear-gradient(120deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin:.3rem 0 1.1rem;
}
.mbtns{display:flex;gap:.45rem}
.mbtns button{
  flex:1;padding:.7rem;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--mute);font-weight:600;font-size:.85rem;cursor:pointer;
}
.mbtns button.main{background:linear-gradient(135deg,var(--accent),#ff5533);border:none;color:#fff}

/* Refined visual system */
:root {
  --bg:#101418; --surface:#171d22; --card:#1b2228;
  --line:rgba(226,235,240,.10); --text:#edf2f4; --mute:#a4b0b7; --faint:#7e8b93;
  --accent:#65b7a4; --accent2:#8bc8b8; --glow:rgba(101,183,164,.16);
}
body { background-image:radial-gradient(ellipse 70% 35% at 50% -18%,rgba(101,183,164,.10),transparent 70%); }
.top { max-width:1180px; padding:1rem 1.5rem; background:rgba(16,20,24,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(14px); }
.brand { display:flex;align-items:center;gap:.65rem;color:var(--text);text-decoration:none;font-family:'Instrument Sans',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.08em; }
.brand-mark { width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(101,183,164,.5);border-radius:10px;color:var(--accent);font-size:1.05rem;letter-spacing:0; }
.brand-sub { display:block;color:var(--faint);font-size:.56rem;letter-spacing:.18em;font-weight:600;line-height:1.2; }
.main { max-width:1180px;padding:1.4rem 1.5rem 4rem; }
.top-actions { gap:.75rem; }
.language-switch { display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#12171b; }
.language-btn { min-width:42px;padding:.42rem .65rem;border:0;border-radius:7px;background:transparent;color:var(--mute);font:600 .75rem 'Instrument Sans',sans-serif;letter-spacing:.04em;cursor:pointer;transition:background .15s,color .15s; }
.language-btn:hover { color:var(--text); }
.language-btn.on { background:#293630;color:#b9e2d6;box-shadow:inset 0 0 0 1px rgba(101,183,164,.18); }
.timer-btn { padding:.58rem .9rem;border:1px solid rgba(101,183,164,.25);border-radius:10px;background:#20302d;color:#b9e2d6;box-shadow:none;font-size:.8rem; }
.day-card { padding:1.1rem 1rem;border-radius:14px; }
.day-card.on { border-color:rgba(101,183,164,.48);background:#202a2a;box-shadow:inset 3px 0 var(--accent); }
.day-card .n { font-family:'Instrument Sans',sans-serif;font-size:1.4rem;font-weight:600;color:#728078; }
.day-card.on .n { color:var(--accent); }
.day-card .label { font-size:.9rem; }
.ex { border-radius:16px; }
.ex-name { font-family:'Instrument Sans',sans-serif;font-weight:650;letter-spacing:-.015em;font-size:1.08rem; }
.ex-sets { color:#b9e2d6;background:rgba(101,183,164,.11); }
.t-card { border-radius:12px;background:rgba(255,255,255,.018); }
.t-art { border-radius:12px;background:rgba(101,183,164,.08);border-color:rgba(101,183,164,.12); }
.t-art svg { filter:hue-rotate(75deg) saturate(.55); }
.t-pct { font-family:'Instrument Sans',sans-serif;font-size:1.2rem;color:var(--accent); }
.tips h4 { color:var(--accent); }
.tips li::before { background:var(--accent); }
.g-btn { border-radius:9px; }
.g-btn.on { background:#29423c;border-color:rgba(101,183,164,.35);color:#c5e8dd;box-shadow:none; }
.stage { border-radius:12px; }
.modal { border-radius:18px; }
.clock { font-family:'Instrument Sans',sans-serif;background:none;-webkit-text-fill-color:var(--accent);color:var(--accent); }
.mbtns button.main { background:#315d52; }
@media(max-width:520px) { .top { padding:.75rem 1rem; }.main { padding:1rem 1rem 3rem; }.brand { gap:.45rem; }.brand-mark { width:30px;height:30px; }.top-actions { gap:.45rem; }.timer-btn { padding:.52rem .68rem; } }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#" aria-label="Apex training"><span class="brand-mark">A</span><span>APEX<span class="brand-sub">TRAINING</span></span></a>
  <div class="top-actions">
    <div class="language-switch" role="group" aria-label="Language">
      <button class="language-btn on" id="flagEn" type="button" aria-pressed="true">EN</button>
      <button class="language-btn" id="flagEl" type="button" aria-pressed="false">ΕΛ</button>
    </div>
    <button class="timer-btn" id="timerBtn" data-i="timer">Rest timer</button>
  </div>
</header>

<main class="main">
  <div class="days" id="days">
    <button class="day-card on" data-d="1">
      <div class="n">01</div>
      <div class="label" data-i="d1">Back & Biceps</div>
      <div class="count">4 exercises</div>
    </button>
    <button class="day-card" data-d="2">
      <div class="n">02</div>
      <div class="label" data-i="d2">Chest & Triceps</div>
      <div class="count">4 exercises</div>
    </button>
    <button class="day-card" data-d="3">
      <div class="n">03</div>
      <div class="label" data-i="d3">Legs</div>
      <div class="count">4 exercises</div>
    </button>
    <button class="day-card" data-d="4">
      <div class="n">04</div>
      <div class="label" data-i="d4">Shoulders</div>
      <div class="count">4 exercises</div>
    </button>
  </div>

  <div class="panel on" id="p1"><div class="ex-grid" id="e1"></div></div>
  <div class="panel" id="p2"><div class="ex-grid" id="e2"></div></div>
  <div class="panel" id="p3"><div class="ex-grid" id="e3"></div></div>
  <div class="panel" id="p4"><div class="ex-grid" id="e4"></div></div>
</main>

<footer data-i="footer">Form first · Consistency always</footer>

<div class="overlay" id="ov">
  <div class="modal">
    <h3 data-i="rt">Rest Timer</h3>
    <p data-i="rs">Between sets</p>
    <div class="presets">
      <button class="pre" data-s="60">60s</button>
      <button class="pre on" data-s="90">90s</button>
      <button class="pre" data-s="120">2m</button>
      <button class="pre" data-s="180">3m</button>
    </div>
    <div class="clock" id="clk">1:30</div>
    <div class="mbtns">
      <button id="tReset" data-i="reset">Reset</button>
      <button class="main" id="tToggle" data-i="start">Start</button>
      <button id="tClose" data-i="close">Close</button>
    </div>
  </div>
</div>

<script src="media-paths.js"></script>
<script>
/* Larger muscle silhouettes */
const SVG = {
  glutes:`<svg viewBox="0 0 64 64" fill="none"><path d="M18 28c0-6 6-12 14-12s14 6 14 12v18c0 4-3 8-8 8h-12c-5 0-8-4-8-8V28z" stroke="#ff6b4a" stroke-width="2.5"/><path d="M20 24c-4-3-5-8-3-12M44 24c4-3 5-8 3-12" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  hamstrings:`<svg viewBox="0 0 64 64" fill="none"><path d="M22 8v48M42 8v48" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M22 32c6 4 14 4 20 0" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  erectors:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 6v52" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M22 16h20M22 32h20M22 48h20" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  quads:`<svg viewBox="0 0 64 64" fill="none"><path d="M20 10v44M44 10v44" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M20 24h24M20 40h24" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  traps:`<svg viewBox="0 0 64 64" fill="none"><path d="M12 44L32 12l20 32" stroke="#ff6b4a" stroke-width="2.5" stroke-linejoin="round"/><path d="M20 44h24" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  lats:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 8v48" stroke="#ff6b4a" stroke-width="2.5"/><path d="M32 18c-12 6-18 16-18 30M32 18c12 6 18 16 18 30" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  rhomboids:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 10l18 22-18 22L14 32z" stroke="#ff6b4a" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  biceps:`<svg viewBox="0 0 64 64" fill="none"><path d="M18 52V24a10 10 0 0120 0v8" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M38 32h6a6 6 0 016 6v14" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  brachialis:`<svg viewBox="0 0 64 64" fill="none"><path d="M22 12v40M22 32h18a6 6 0 016 6v14" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  forearms:`<svg viewBox="0 0 64 64" fill="none"><path d="M26 8v48M38 18v38" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  chest:`<svg viewBox="0 0 64 64" fill="none"><path d="M8 26c6-10 18-14 24-14s18 4 24 14v12c-6 8-18 12-24 12s-18-4-24-12V26z" stroke="#ff6b4a" stroke-width="2.5"/></svg>`,
  upperchest:`<svg viewBox="0 0 64 64" fill="none"><path d="M8 30c6-12 18-16 24-16s18 4 24 16" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M14 36c6 4 14 6 18 6s12-2 18-6" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  triceps:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 8v48" stroke="#ff6b4a" stroke-width="2.5"/><path d="M20 18c0 12 4 22 12 32M44 18c0 12-4 22-12 32" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  frontdelts:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="26" r="14" stroke="#ff6b4a" stroke-width="2.5"/><path d="M20 38l-8 16M44 38l8 16" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  sidedelts:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 18v32" stroke="#ff6b4a" stroke-width="2.5"/><path d="M10 32h44" stroke="#ff6b4a" stroke-width="2.5"/><path d="M16 22l-6 10 6 10M48 22l6 10-6 10" stroke="#ff6b4a" stroke-width="2" stroke-linecap="round"/></svg>`,
  reardelts:`<svg viewBox="0 0 64 64" fill="none"><path d="M14 26c6-8 14-12 18-12s12 4 18 12" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/><path d="M18 38c5 8 10 12 14 12s9-4 14-12" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  core:`<svg viewBox="0 0 64 64" fill="none"><rect x="20" y="10" width="24" height="44" rx="6" stroke="#ff6b4a" stroke-width="2.5"/><path d="M20 24h24M20 38h24" stroke="#ff6b4a" stroke-width="2"/></svg>`,
  rotator:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="10" stroke="#ff6b4a" stroke-width="2.5"/><path d="M32 12v6M32 46v6M12 32h6M46 32h6" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  anconeus:`<svg viewBox="0 0 64 64" fill="none"><path d="M32 8v24l12 24M32 32L20 56" stroke="#ff6b4a" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  default:`<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="18" stroke="#ff6b4a" stroke-width="2.5"/></svg>`
};
function icon(k){
  const s=(k||'').toLowerCase();
  if(s.includes('glute'))return SVG.glutes;
  if(s.includes('hamstring')||s.includes('opisth'))return SVG.hamstrings;
  if(s.includes('erector')||s.includes('orth'))return SVG.erectors;
  if(s.includes('quad')||s.includes('tetra'))return SVG.quads;
  if(s.includes('trap'))return SVG.traps;
  if(s.includes('lat')||s.includes('plate'))return SVG.lats;
  if(s.includes('rhomb'))return SVG.rhomboids;
  if(s.includes('bicep')||s.includes('dikef'))return SVG.biceps;
  if(s.includes('brach'))return SVG.brachialis;
  if(s.includes('forearm')||s.includes('piche'))return SVG.forearms;
  if(s.includes('upper')||s.includes('ano'))return SVG.upperchest;
  if(s.includes('chest')||s.includes('stith'))return SVG.chest;
  if(s.includes('tricep')||s.includes('trikef'))return SVG.triceps;
  if(s.includes('front')||s.includes('prosthi'))return SVG.frontdelts;
  if(s.includes('side')||s.includes('plagi'))return SVG.sidedelts;
  if(s.includes('rear')||s.includes('opisthiod'))return SVG.reardelts;
  if(s.includes('core')||s.includes('korm'))return SVG.core;
  if(s.includes('rotat')||s.includes('perist'))return SVG.rotator;
  if(s.includes('ancon'))return SVG.anconeus;
  return SVG.default;
}

const I18={
  en:{timer:'Rest',d1:'Back & Biceps',d2:'Chest & Triceps',d3:'Legs',d4:'Shoulders',

let lang=localStorage.getItem('apexLang')||'en';
let exGender=JSON.parse(localStorage.getItem('apexExGen')||'{}');
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const t=k=>I18[lang][k]||I18.en[k]||k;
const enc=p=>p.split('/').map(s=>encodeURIComponent(s)).join('/');

function apply(){
  $$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('#flagEn').classList.toggle('on',lang==='en');
  $('#flagEl').classList.toggle('on',lang==='el');
  $('#flagEn').setAttribute('aria-pressed',String(lang==='en'));
  $('#flagEl').setAttribute('aria-pressed',String(lang==='el'));
  $('#timerBtn').textContent = lang==='en' ? 'Rest timer' : 'Χρονόμετρο';
  document.documentElement.lang=lang;
  draw();
}

function mediaHTML(ex,g){
  const m = (ex.mediaKey && window.MEDIA && window.MEDIA[ex.mediaKey])
    ? window.MEDIA[ex.mediaKey]
    : (ex.media || null);
  if(!m) return '<p style="color:#6a6a78;text-align:center;padding:2rem">—</p>';
  const primary = g==='female' ? (m.female || m.male) : (m.male || m.female);
  const fallback = g==='female' ? m.male : m.female;
  if(!primary) return '<p style="color:#6a6a78;text-align:center;padding:2rem">—</p>';
  const src = enc(primary);
  const fb = fallback && fallback !== primary ? enc(fallback) : '';
  if(/\.(mp4|mkv|webm)$/i.test(primary)){
    const onerr = fb ? ` onerror="this.onerror=null;this.src='${fb}'"` : '';
    return `<video src="${src}" autoplay loop muted playsinline controls${onerr}></video>`;
  }
  return `<img src="${src}" alt="${ex.n[lang]}" loading="lazy">`;
}

function draw(){
  for(let d=1;d<=4;d++){
    const box=$('#e'+d); box.innerHTML='';
    D[d].forEach(ex=>{
      const g=exGender[ex.id]||'male';
      const c=document.createElement('article');
      c.className='ex'; c.dataset.id=ex.id;
      c.innerHTML=`
        <div class="ex-head">
          <div class="row">
            <div class="ex-name">${ex.n[lang]}</div>
            <span class="ex-sets">${ex.s}</span>
          </div>
          <div class="ex-muscles">${ex.m[lang]}</div>
        </div>
        <div class="targets">${ex.targets.map(tg=>`
          <div class="t-card">
            <div class="t-art">${icon(tg.k||tg.en)}</div>
            <div class="t-pct">${tg.p}%</div>
            <div class="t-name">${tg[lang]||tg.en}</div>
          </div>`).join('')}</div>
        <div class="tips">
          <h4>${t('tips')}</h4>
          <ul>${ex.t[lang].map(x=>'<li>'+x+'</li>').join('')}</ul>
        </div>
        <div class="media-area">
          <div class="g-row">
            <button class="g-btn${g==='male'?' on':''}" data-g="male" data-ex="${ex.id}">${t('male')}</button>
            <button class="g-btn${g==='female'?' on':''}" data-g="female" data-ex="${ex.id}">${t('female')}</button>
          </div>
          <div class="stage" data-media="${ex.id}">${mediaHTML(ex,g)}</div>
        </div>`;
      box.appendChild(c);
    });
  }
}

$('#days').onclick=e=>{
  const btn=e.target.closest('.day-card'); if(!btn)return;
  $$('.day-card').forEach(x=>x.classList.remove('on'));
  btn.classList.add('on');
  $$('.panel').forEach(p=>p.classList.remove('on'));
  $('#p'+btn.dataset.d).classList.add('on');
};

document.onclick=e=>{
  const gb=e.target.closest('.g-btn');
  if(!gb)return;
  const id=gb.dataset.ex, g=gb.dataset.g;
  exGender[id]=g; localStorage.setItem('apexExGen',JSON.stringify(exGender));
  gb.parentElement.querySelectorAll('.g-btn').forEach(b=>b.classList.toggle('on',b.dataset.g===g));
  const mediaBox=gb.closest('.ex').querySelector('[data-media="'+id+'"]');
  let ex=null;
  for(const day of Object.values(D)){const f=day.find(x=>x.id===id);if(f){ex=f;break}}
  if(ex&&mediaBox)mediaBox.innerHTML=mediaHTML(ex,g);
};

$('#flagEn').onclick=()=>{lang='en';localStorage.setItem('apexLang',lang);apply()};
$('#flagEl').onclick=()=>{lang='el';localStorage.setItem('apexLang',lang);apply()};

let S=90,R=90,IV=null;
const ov=$('#ov'),clk=$('#clk'),tt=$('#tToggle');
const fmt=s=>Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');
const upd=()=>clk.textContent=fmt(R);
$('#timerBtn').onclick=()=>ov.classList.add('show');
$('#tClose').onclick=()=>ov.classList.remove('show');
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('show')};
$$('.pre').forEach(b=>b.onclick=()=>{
  $$('.pre').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  S=+b.dataset.s;R=S;if(IV){clearInterval(IV);IV=null;tt.textContent=t('start')}upd();
});
tt.onclick=()=>{
  if(IV){clearInterval(IV);IV=null;tt.textContent=t('start')}
  else{tt.textContent=lang==='en'?'Pause':'Παύση';
    IV=setInterval(()=>{R--;upd();if(R<=0){clearInterval(IV);IV=null;tt.textContent=t('start');R=S;upd();navigator.vibrate&&navigator.vibrate([180,60,180])}},1000)}
};
$('#tReset').onclick=()=>{if(IV){clearInterval(IV);IV=null;tt.textContent=t('start')}R=S;upd()};

apply();
</script>
